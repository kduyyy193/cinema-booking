# Template: setup-https.ps1 thay {{CERT_DIR}} rồi ghi vào <nginx>\conf\conf.d\cinebooking.conf
# (nginx chính cần có `include conf.d/*.conf;` trong khối http).
# App: php -S 127.0.0.1:8100 -t public public/index.php

upstream cinebooking_app {
    server 127.0.0.1:8100;
    keepalive 8;
}

server {
    listen 80;
    server_name cinebooking.com www.cinebooking.com;
    return 301 https://cinebooking.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.cinebooking.com;
    ssl_certificate     "{{CERT_DIR}}/cinebooking.com.pem";
    ssl_certificate_key "{{CERT_DIR}}/cinebooking.com-key.pem";
    return 301 https://cinebooking.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cinebooking.com;

    ssl_certificate     "{{CERT_DIR}}/cinebooking.com.pem";
    ssl_certificate_key "{{CERT_DIR}}/cinebooking.com-key.pem";
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;   # upload poster
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://cinebooking_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
