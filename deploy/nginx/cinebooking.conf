# Template: setup-https.ps1 thay {{CERT_DIR}} và {{PROJECT_DIR}} rồi ghi vào <nginx>\conf\conf.d\cinebooking.conf
# (nginx chính cần có `include conf.d/*.conf;` trong khối http).
# App: php -S 127.0.0.1:8100 -t public public/index.php

upstream cinebooking_app {
    server 127.0.0.1:8100;
    keepalive 8;
}

server {
    listen 80;
    server_name cinebooking.com www.cinebooking.com;
    return 301 https://cinebooking.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.cinebooking.com;
    ssl_certificate     "{{CERT_DIR}}/cinebooking.com.pem";
    ssl_certificate_key "{{CERT_DIR}}/cinebooking.com-key.pem";
    return 301 https://cinebooking.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cinebooking.com;

    ssl_certificate     "{{CERT_DIR}}/cinebooking.com.pem";
    ssl_certificate_key "{{CERT_DIR}}/cinebooking.com-key.pem";
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;   # upload poster
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Tài nguyên tĩnh: nginx phục vụ trực tiếp, tự gửi ETag, Last-Modified và trả 304 khi chưa đổi.
    location /assets/ {
        alias "{{PROJECT_DIR}}/public/assets/";
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /uploads/ {
        alias "{{PROJECT_DIR}}/public/uploads/";
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        location ~* \.(php|phtml|phar)$ { return 403; }
    }

    # SSE (cập nhật trạng thái thanh toán): tắt đệm để sự kiện đến trình duyệt ngay.
    location = /payment/stream {
        proxy_pass http://cinebooking_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # Trang động: ứng dụng tự gửi ETag, Cache-Control (private, no-cache hoặc no-store).
    location / {
        proxy_pass http://cinebooking_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
